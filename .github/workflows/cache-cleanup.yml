name: Cache cleanup

# GitHub caps a repo's Actions cache at 10GB and evicts LRU once full — which
# can drop a cache we still want (a warm buildkit layer) just because a burst of
# throwaway entries crowded it out. Our CI produces many short-lived
# `buildkit-blob-*` caches per run, so the cap is reached by volume, not by any
# single large cache. This sweeps entries older than a threshold on a schedule so
# eviction is driven by our policy (age) instead of GitHub's (least-recently-used).

on:
  schedule:
    # Daily at 02:00 UTC — before the working day, after any overnight CI.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      max_age_days:
        description: "Delete caches older than this many days"
        required: false
        default: "2"

concurrency:
  group: cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete old caches
    runs-on: ubuntu-latest
    permissions:
      # Deleting caches requires write; nothing else is touched.
      actions: write
    steps:
      - name: Delete caches older than threshold
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # workflow_dispatch input on manual runs; 2 days on the scheduled run.
          MAX_AGE_DAYS: ${{ github.event.inputs.max_age_days || '2' }}
        run: |
          set -euo pipefail
          cutoff=$(( $(date -u +%s) - MAX_AGE_DAYS * 86400 ))
          echo "Deleting caches created before $(date -u -d "@$cutoff" '+%Y-%m-%dT%H:%M:%SZ') (> ${MAX_AGE_DAYS}d old)"

          # jq strips the fractional seconds GitHub emits (fromdateiso8601 can't
          # parse them), then keeps only ids older than the cutoff.
          ids=$(gh api --paginate "/repos/$REPO/actions/caches" \
            --jq "[.actions_caches[]
                   | select((.created_at | sub(\"\\\\.[0-9]+\"; \"\") | fromdateiso8601) < $cutoff)
                   | .id] | .[]")

          if [ -z "$ids" ]; then
            echo "No caches older than ${MAX_AGE_DAYS} days. Nothing to delete."
            exit 0
          fi

          deleted=0
          for id in $ids; do
            gh api --method DELETE "/repos/$REPO/actions/caches/$id" && deleted=$((deleted+1))
          done
          echo "Deleted $deleted cache(s)."
